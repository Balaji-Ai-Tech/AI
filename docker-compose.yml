services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://transformhub:${POSTGRES_PASSWORD:-transformhub}@postgres:5432/transformhub
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://transformhub:${POSTGRES_PASSWORD:-transformhub}@postgres:5432/transformhub
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: transformhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transformhub}
      POSTGRES_DB: transformhub
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transformhub -d transformhub"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
